<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tape Stop</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #stage {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
      }

      #pause-menu {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
      }

      /* display:flex above would otherwise override the hidden attribute */
      #pause-menu[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="pause-menu" hidden>
        <h2 id="pause-title"></h2>
        <button id="pause-resume"></button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
